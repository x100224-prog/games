<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小遊戲</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
:root { color-scheme: dark; --bg: #14171c; --ink: #eef2f3; --mute: #9aa6b0; --line: rgba(255,255,255,.13); --sign: #0b6b4f; --pudding: #e2bd5f; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; display: grid; gap: 16px; }
h1 { margin: 0 0 4px; font-size: 26px; font-weight: 900; letter-spacing: .06em; }
p { margin: 0; color: var(--mute); font-size: 14px; line-height: 1.6; }
a.game { display: grid; gap: 4px; text-decoration: none; color: inherit; border-radius: 12px; padding: 16px 18px; border: 3px solid #fff; box-shadow: 0 0 0 3px var(--c), 0 10px 30px rgba(0,0,0,.4); background: var(--c); }
a.game b { font-size: 26px; font-weight: 900; letter-spacing: .06em; }
a.game span { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 700; letter-spacing: .14em; font-size: 13px; }
a.game em { font-style: normal; font-size: 14px; opacity: .9; }
a.game:focus-visible { outline: 3px solid #f5c518; outline-offset: 4px; }
.yingge { --c: var(--pudding); color: #2a1c08; }
.taipei { --c: var(--sign); color: #fff; }
.sky { --c: #2a2d2b; color: #e6e1d3; }
.soon { border: 1px dashed var(--line); border-radius: 12px; padding: 14px 18px; color: var(--mute); font-size: 14px; }
.fine { font-size: 12px; }
.fine a { color: inherit; }
</style>
</head>
<body>
<main>
  <div>
    <h1>小遊戲</h1>
    <p>電腦用鍵盤滑鼠、手機用觸控都能玩，不用登入。</p>
  </div>
  <a class="game yingge" href="yingge/"><b>布丁狗去鶯歌</b><span>LUZHOU → YINGGE</span><em>從蘆洲重陽公園開到鶯歌捷運站</em></a>
  <a class="game sky" href="sky/"><b>SKY 塵蟎之晨</b><span>AIR · HORROR</span><em>第一人稱空氣污染恐怖遊戲：臥室、廚房、廟宇、學校</em></a>
  <a class="game taipei" href="taipei/"><b>台北上班路</b><span>TAIPEI COMMUTE</span><em>每天開車上下班賺薪水，買導航、電動車、飛天跑車、無人機</em></a>
  <p class="fine">地圖 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者；地形：內政部 20 公尺網格數值地形模型；人物：Quaternius（CC0）；配樂與音效為原創。</p>
</main>
</body>
</html>
